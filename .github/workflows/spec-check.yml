name: Spec Freshness Check

on:
  schedule:
    - cron: '0 0 * * 1'  # 每周一 UTC 00:00 运行
  workflow_dispatch:      # 支持手动触发

jobs:
  spec-freshness:
    name: Check Spec Freshness
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 需要完整历史以检查文件更新时间
      
      - name: Check spec freshness
        run: |
          python3 .trellis/scripts/check_spec_freshness.py
        continue-on-error: true
      
      - name: Create issue if stale specs found
        if: steps.check.outputs.stale_specs != ''
        uses: actions/github-script@v6
        with:
          script: |
            const staleSpecs = '${{ steps.check.outputs.stale_specs }}';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '📋 Spec 过期提醒',
              body: `以下 spec 文件已超过 30 天未更新：\n\n${staleSpecs}\n\n请考虑更新以反映最新约定。`,
              labels: ['documentation', 'stale-spec']
            });
